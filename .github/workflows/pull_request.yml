name: Pull Request Events

on:
  pull_request:
    paths-ignore:
      - .github/ISSUE_TEMPLATE/**

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Set up code
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: ⬢ Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: 🧪 Run workflow unit tests
        run: node --test tests/issue_edit.test.mjs

      - name: 🧪 Run Python tests and upload coverage
        uses: ./.github/actions/test-and-coverage
        with:
          testing_db_connections: ${{ secrets.TESTING_DB_CONNECTIONS }}
          codecov_token: ${{ secrets.CODECOV_TOKEN }}
